<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/images/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  </head>
  <body>
    <nav>
      <img class="logo" src="/src/images/Logo.svg" alt="Logo" />
    </nav>

    <header>
      <h1>Interested in our business pricing?</h1>
      <p>
        Fill out the form to view details and we’ll contact you as soon as
        possible.
      </p>
    </header>

    <main>
      <form action="#">
        <div>
          <label for="name">Name</label>
          <input type="text" name="name" id="name" placeholder="Ethan Johnson" />
        </div>

        <div>
          <label for="email">Company Email</label>
          <input type="email" name="email" id="email" placeholder="ethan@johnson.com" />
        </div>

        <div>
          <label for="company">Company Size</label>
          <select name="company" id="company">
            <option value="1-10">1-10</option>
            <option value="11-50">11-50</option>
            <option value="51-200">51-200</option>
            <option value="201-500">201-500</option>
            <option value="501+">501+</option>
          </select>
        </div>

        <div>
          <label for="subject">Subject</label>
          <select name="subject" id="subject">
            <option value="building">Building Landing pages</option>
            <option value="support">Support</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div>
          <label for="message">Message</label>
          <textarea name="message" id="message" placeholder="50-100 employees"></textarea>
        </div>

        <div>
          <button type="submit">Submit</button>
        </div>
      </form>
    </main>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
