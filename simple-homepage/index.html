<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const savedTheme = localStorage.getItem("active-theme");

        if (savedTheme === "dark") {
          document.documentElement.classList.add("dark-mode");
        }
      })();
    </script>
    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <title>Simple Homepage - Alarado | devChallenges.io</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <nav class="nav">
      <div>
        <img src="./assets/images/logo-light.svg" alt="Logo" />
      </div>

      <div class="nav-link">
        <ul>
          <li><a href="#">About us</a></li>
          <li><a href="#">Product</a></li>
          <li><a href="#">Resource</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
        <button class="toggle-theme" aria-label="Toggle theme button">
          <img
            src="./assets/images/Moon_fill_light.svg"
            alt="Moon Icon"
            class="moon"
          />
          <img src="./assets/images/Sun_fill.svg" alt="Sun Icon" class="sun" />
        </button>
        <button class="close-btn">
          <img src="./assets/images/close-button.svg" alt="Close icon" />
        </button>
      </div>

      <button class="open-btn">
        <img src="./assets/images/hamburger-button.svg" alt="Hambunger icon" />
      </button>
    </nav>

    <header class="header">
      <div class="text-content">
        <p>😎 Simple way to communicate</p>
        <h1>Actions for Accessibility in Design</h1>
        <p>
          The fastest way to build and deploy websites with resusable
          components.
        </p>
        <div class="button-wrapper">
          <button>Get Started</button>
          <button>Get live demo</button>
        </div>
        <footer>
          <div>
            <img
              src="./assets/images/Done_ring_round_fill.svg"
              alt="Done ring round icon"
            />
            <p>No credit card required</p>
          </div>
          <div>
            <img
              src="./assets/images/Done_ring_round_fill.svg"
              alt="Done ring round icon"
            />
            <p>No software to install</p>
          </div>
        </footer>
      </div>
      <div class="image-content">
        <img
          src="./assets/images/hero-image-simple-homepage.png"
          alt="Hero image homepage"
        />
      </div>
    </header>

    <script src="./assets/js/app.js"></script>
  </body>
</html>
