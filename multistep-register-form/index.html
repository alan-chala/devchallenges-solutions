<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Multi-step Register Form | devChallenges.io"
    />
    <meta
      name="keywords"
      content="HTML, CSS, JavaScript, Form, Multi-step Form"
    />
    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <title>Multi-step Register Form | devChallenges.io</title>
    <style>
      .step {
        display: none;
      }

      .step.active {
        display: block;
      }

      .message-1,
      .message-2 {
        display: none;
      }
    </style>
  </head>
  <body>
    <form class="form">
      <article class="step active">
        <h1>Register</h1>

        <label name="name">
          Name
          <input id="name" name="name" placeholder="Enter your name" />
        </label>

        <label name="email">
          Email
          <input id="email" name="email" placeholder="Example@gmail.com" />
        </label>

        <span class="message-1">All fields are required!</span>

        <button class="first-next" type="button">Continue</button>
      </article>

      <article class="step">
        <h2>Which topics you are interested in?</h2>

        <label name="software-development">
          <input
            type="checkbox"
            id="software-development"
            name="software-development"
            value="Software Development"
          />
          Software Development
        </label>

        <label name="user-experience">
          <input
            type="checkbox"
            id="user-experience"
            name="user-experience"
            value="User Experience"
          />
          User Experience
        </label>

        <label name="graphic-design">
          <input
            type="checkbox"
            id="graphic-design"
            name="graphic-design"
            value="Graphic Design"
          />
          Graphic Design
        </label>

        <span class="message-2">Please, mark at least one option!</span>

        <button class="second-next" type="button">Continue</button>
      </article>

      <article class="step">
        <h2>Summary</h2>

        <p>Name: <span class="name">Emily Johnson</span></p>
        <p>Email: <span class="email">emily@emilyjohnsonstl.com</span></p>
        <p>Topics:</p>

        <ul class="topics">
          <li>User Experience</li>
          <li>Graphic Design</li>
        </ul>

        <button type="submit">Continue</button>
      </article>
    </form>

    <script src="./assets/js/app.js"></script>
  </body>
</html>
