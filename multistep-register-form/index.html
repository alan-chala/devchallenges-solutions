<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Multi-step Register Form | devChallenges.io"
    />
    <meta
      name="keywords"
      content="HTML, CSS, JavaScript, Form, Multi-step Form"
    />
    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <title>Multi-step Register Form | devChallenges.io</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <form class="form">
      <article class="step step-1 active">
        <h1>Register</h1>

        <label name="name">
          Name
          <input id="name" name="name" placeholder="Enter your name" />
        </label>

        <label name="email">
          Email
          <input id="email" name="email" placeholder="Example@gmail.com" />
        </label>

        <span class="message-1">All fields are required!</span>

        <button class="first-next" type="button">Continue</button>

        <div class="progress" aria-label="Step 1 of 3">
          <span class="step-label">Step 1 of 3</span>
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </article>

      <article class="step step-2">
        <h2>Which topics you are interested in?</h2>

        <label class="topic-option" name="software-development">
          <input
            type="checkbox"
            id="software-development"
            name="software-development"
            value="Software Development"
          />
          <span>Software Development</span>
        </label>

        <label class="topic-option" name="user-experience">
          <input
            type="checkbox"
            id="user-experience"
            name="user-experience"
            value="User Experience"
          />
          <span>User Experience</span>
        </label>

        <label class="topic-option" name="graphic-design">
          <input
            type="checkbox"
            id="graphic-design"
            name="graphic-design"
            value="Graphic Design"
          />
          <span>Graphic Design</span>
        </label>

        <span class="message-2">Please, mark at least one option!</span>

        <button class="second-next" type="button">Continue</button>

        <div class="progress" aria-label="Step 2 of 3">
          <span class="step-label">Step 2 of 3</span>
          <span class="dot"></span>
          <span class="dot active"></span>
          <span class="dot"></span>
        </div>
      </article>

      <article class="step step-3">
        <h2>Summary</h2>

        <p>Name: <span class="name">Emily Johnson</span></p>
        <p>Email: <span class="email">emily@emilyjohnsonstl.com</span></p>
        <p>Topics:</p>

        <ul class="topics">
          <li>User Experience</li>
          <li>Graphic Design</li>
        </ul>

        <button type="submit">Confirm</button>

        <div class="progress" aria-label="Step 3 of 3">
          <span class="step-label">Step 3 of 3</span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot active"></span>
        </div>
      </article>
    </form>

    <script src="./assets/js/app.js"></script>
  </body>
</html>
